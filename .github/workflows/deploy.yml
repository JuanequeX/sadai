name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy a la vez. No cancelamos el que ya corre para no dejar Pages a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Antes de setup-node: `cache: pnpm` necesita que el binario ya exista.
      # La versión sale del campo `packageManager` de package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/configure-pages@v6

      - run: pnpm install --frozen-lockfile

      # `output: "export"` deja el sitio en out/.
      - run: pnpm build

      # El flujo de artefactos no ejecuta Jekyll, pero sin esto cualquier ruta
      # que sí lo ejecutara ignoraría `_next/` por empezar con guion bajo.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
